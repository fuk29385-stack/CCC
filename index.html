<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Control Center</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <header class="app-header">
    <button class="icon-button" type="button" aria-label="Открыть меню">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24">
        <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
      </svg>
    </button>
    <h1>College Control Center</h1>
    <button class="icon-button" type="button" aria-label="Профиль">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24">
        <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
      </svg>
    </button>
  </header>

  <main>
    <section class="calendar" aria-labelledby="calendar-title">
      <h2 id="calendar-title">Календарь</h2>
      <nav aria-label="Дни недели">
        <ul class="weekdays">
          <li>Пн</li>
          <li>Вт</li>
          <li>Ср</li>
          <li>Чт</li>
          <li>Пт</li>
          <li>Сб</li>
          <li>Вс</li>
        </ul>
      </nav>
    </section>

    <section class="tasks" aria-labelledby="tasks-title">
      <h2 id="tasks-title">Мои задачи</h2>
      <ul class="task-list" aria-live="polite"></ul>
    </section>
  </main>

  <button class="add-task-button" type="button" aria-label="Добавить задачу" aria-haspopup="dialog">
    <span aria-hidden="true">+</span>
  </button>

  <dialog class="task-dialog" aria-labelledby="task-dialog-title">
    <form class="task-form" novalidate>
      <header>
        <h2 id="task-dialog-title">Новая задача</h2>
      </header>

      <label for="task-title">Название</label>
      <input id="task-title" name="title" type="text" required>

      <label for="task-date">Дата</label>
      <input id="task-date" name="date" type="date" required>

      <label for="task-subject">Предмет</label>
      <input id="task-subject" name="subject" type="text" required>

      <label for="task-description">Описание</label>
      <textarea id="task-description" name="description" rows="4" required minlength="12"></textarea>

      <label for="task-important">
        <input id="task-important" name="important" type="checkbox">
        Важная задача
      </label>

      <footer>
        <button type="submit" disabled>Сохранить</button>
        <button type="button">Отменить</button>
      </footer>
    </form>
  </dialog>

<script src="app.js" defer></script>
</body>
</html>
